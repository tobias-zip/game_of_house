server {
    listen 80;
    root /usr/share/nginx/html;

    # index.html and files with fixed names: the browser keeps them but asks on every
    # load whether they changed, so a deploy shows up on the next load.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Vite puts content hashes in asset file names, so they can be cached for good.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
